# Vendored from the published hypersync-net-types crate; retains its MPL-2.0 license.
# The transport uses Cap'n Proto 0.24 with regenerated schema bindings.

[package]
publish = false
edition = "2021"
name = "hypersync-net-types"
version = "0.12.3"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "hypersync types for transport over network"
readme = false
license = "MPL-2.0"

[features]
arbitrary = ["dep:arbitrary"]

[lib]
name = "hypersync_net_types"
path = "src/lib.rs"

[[test]]
name = "backward_compatibility"
path = "tests/backward_compatibility.rs"

[[bench]]
name = "compression"
path = "benches/compression.rs"
harness = false

[dependencies.anyhow]
version = "1.0.100"

[dependencies.arbitrary]
version = "1.4.2"
features = ["derive"]
optional = true

[dependencies.arrayvec]
version = "0.7"
features = ["serde"]

[dependencies.capnp]
version = "0.24.1"

[dependencies.hypersync-format]
version = "0.7.0"

[dependencies.schemars]
version = "1.0.4"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.strum]
version = "0.27.2"

[dependencies.strum_macros]
version = "0.27.2"

[dependencies.xxhash-rust]
version = "0.8.15"

[dev-dependencies.hypersync-schema]
version = "0.4.0"

[dev-dependencies.flate2]
version = "1.1.5"

[dev-dependencies.lz4_flex]
version = "0.11.5"

[dev-dependencies.pretty_assertions]
version = "1"

[dev-dependencies.serde_json]
version = "1"

[dev-dependencies.sha3]
version = "0.10.8"

[dev-dependencies.tabled]
version = "0.20.0"

[dev-dependencies.zstd]
version = "0.13.3"
